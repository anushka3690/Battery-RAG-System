<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battery RAG Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vercel.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f7f7f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            padding: 1rem;
            text-align: center;
            background-color: white;
            border-bottom: 1px solid #e5e5e5;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #333;
            font-weight: 600;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            word-wrap: break-word;
        }

        .message.user {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }

        .message.assistant {
            background-color: #e9ecef;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }

        .message.system {
            background-color: #d4edda;
            color: #155724;
            align-self: center;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 0.875rem;
        }

        .input-container {
            padding: 1rem;
            background-color: white;
            border-top: 1px solid #e5e5e5;
        }

        .input-wrapper {
            display: flex;
            gap: 0.5rem;
            max-width: 100%;
        }

        .input-box {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 1.5rem;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            outline: none;
            resize: none;
            max-height: 120px;
            min-height: 48px;
        }

        .input-box:focus {
            border-color: #007bff;
        }

        .send-button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .send-button:hover:not(:disabled) {
            background-color: #0056b3;
        }

        .send-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            max-width: 80%;
            padding: 0.75rem 1rem;
            background-color: #e9ecef;
            border-radius: 1rem;
            border-bottom-left-radius: 0.25rem;
            align-self: flex-start;
            color: #666;
        }

        .typing-indicator.show {
            display: block;
        }

        .typing-dots {
            display: inline-flex;
            gap: 0.25rem;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background-color: #666;
            border-radius: 50%;
            animation: typingBounce 1.5s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        .init-notice {
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        .init-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }

        .init-button:hover {
            background-color: #0056b3;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .chat-container {
                max-width: 100%;
            }
            
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h1>🔋 Battery Assistant</h1>
        </div>

        <div class="messages" id="messages">
            <div class="init-notice" id="initNotice">
                <p>Welcome! Initialize the system to start chatting.</p>
                <button class="init-button" onclick="initializeSystem()">Initialize System</button>
            </div>
            
            <div class="typing-indicator" id="typingIndicator">
                Typing
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <textarea 
                    id="messageInput" 
                    class="input-box" 
                    placeholder="Ask me about batteries..."
                    rows="1"
                    disabled
                ></textarea>
                <button id="sendButton" class="send-button" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let isInitialized = false;
        let isLoading = false;

        const initNotice = document.getElementById('initNotice');
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        async function initializeSystem() {
            if (isLoading) return;
            
            isLoading = true;
            addMessage('system', 'Initializing system...');
            
            try {
                const response = await fetch('/initialize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    isInitialized = true;
                    initNotice.classList.add('hidden');
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                    messageInput.focus();
                    
                    addMessage('system', 'System ready! Ask me anything about batteries.');
                } else {
                    addMessage('system', 'Error: ' + data.message);
                }
            } catch (error) {
                addMessage('system', 'Failed to initialize. Please try again.');
            }
            
            isLoading = false;
        }

        async function sendMessage() {
            const query = messageInput.value.trim();
            if (!query || !isInitialized || isLoading) return;
            
            addMessage('user', query);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            
            showTypingIndicator();
            
            isLoading = true;
            sendButton.disabled = true;
            
            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query })
                });
                
                const data = await response.json();
                
                hideTypingIndicator();
                
                if (data.status === 'success') {
                    addMessage('assistant', data.result.response);
                } else {
                    addMessage('assistant', data.message);
                }
            } catch (error) {
                hideTypingIndicator();
                addMessage('assistant', 'Sorry, something went wrong. Please try again.');
            }
            
            isLoading = false;
            sendButton.disabled = false;
        }

        function addMessage(type, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = content;
            
            messagesContainer.insertBefore(messageDiv, typingIndicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTypingIndicator() {
            typingIndicator.classList.add('show');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTypingIndicator() {
            typingIndicator.classList.remove('show');
        }

        // Check system health on load
        window.addEventListener('load', async function() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                
                if (data.initialized) {
                    isInitialized = true;
                    initNotice.classList.add('hidden');
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                    addMessage('system', 'System ready! Ask me anything about batteries.');
                }
            } catch (error) {
                console.log('Health check failed');
            }
        });
    </script>
</body>
</html>

                ></textarea>
                <button id="sendButton" class="send-button" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let isInitialized = false;
        let isLoading = false;

        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const initBanner = document.getElementById('initBanner');
        const welcomeMessage = document.getElementById('welcomeMessage');
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');

        // Initialize system
        initBanner.addEventListener('click', initializeSystem);
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        async function initializeSystem() {
            if (isLoading) return;
            
            isLoading = true;
            updateStatus('loading', 'Initializing...');
            
            try {
                const response = await fetch('/initialize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    isInitialized = true;
                    updateStatus('ready', 'Ready');
                    initBanner.classList.add('hidden');
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                    messageInput.focus();
                    
                    addMessage('system', 'SYS', data.message);
                } else {
                    updateStatus('error', 'Error');
                    addMessage('system', 'SYS', data.message);
                }
            } catch (error) {
                updateStatus('error', 'Error');
                addMessage('system', 'SYS', '❌ Failed to initialize system. Please try again.');
            }
            
            isLoading = false;
        }

        async function sendMessage() {
            const query = messageInput.value.trim();
            if (!query || !isInitialized || isLoading) return;
            
            // Add user message
            addMessage('user', 'You', query);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            
            // Hide welcome message
            welcomeMessage.style.display = 'none';
            
            // Show typing indicator
            showTypingIndicator();
            
            isLoading = true;
            sendButton.disabled = true;
            
            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query })
                });
                
                const data = await response.json();
                
                hideTypingIndicator();
                
                if (data.status === 'success') {
                    addMessage('assistant', 'AI', data.result.response);
                } else {
                    addMessage('assistant', 'AI', data.message);
                }
            } catch (error) {
                hideTypingIndicator();
                addMessage('assistant', 'AI', '❌ Error processing your request. Please try again.');
            }
            
            isLoading = false;
            sendButton.disabled = false;
        }

        function sendExampleQuery(query) {
            if (!isInitialized) {
                initializeSystem();
                return;
            }
            
            messageInput.value = query;
            sendMessage();
        }

        function addMessage(type, sender, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            messageDiv.innerHTML = `
                <div class="avatar ${type}">${sender}</div>
                <div class="message-content">${formatMessage(content)}</div>
            `;
            
            messagesContainer.insertBefore(messageDiv, typingIndicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function formatMessage(content) {
            // Simple formatting for code blocks and line breaks
            return content
                .replace(/\n/g, '<br>')
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>');
        }

        function showTypingIndicator() {
            typingIndicator.classList.add('show');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTypingIndicator() {
            typingIndicator.classList.remove('show');
        }

        function updateStatus(status, text) {
            statusIndicator.className = `status-indicator ${status}`;
            statusText.textContent = text;
        }

        // Check system health on load
        window.addEventListener('load', async function() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                
                if (data.initialized) {
                    isInitialized = true;
                    updateStatus('ready', 'Ready');
                    initBanner.classList.add('hidden');
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                }
                
                // Check if this is a Vercel deployment
                if (data.deployment_type === 'vercel-lightweight') {
                    // Add Vercel deployment notice
                    const noticeDiv = document.createElement('div');
                    noticeDiv.className = 'vercel-notice';
                    noticeDiv.innerHTML = `
                        <h3>⚠️ Vercel Lightweight Deployment</h3>
                        <p>This is a limited version of the Battery RAG System due to Vercel's 50MB function size limit.</p>
                        <p>The full system with embedding model (~90MB), vector database (>200MB), and dependencies (~150MB) 
                        exceeds Vercel's size limitations.</p>
                        
                        <div class="deployment-options">
                            <h4>For full functionality:</h4>
                            <ul>
                                <li>Run locally with <code>python app.py</code></li>
                                <li>Deploy to AWS Lambda with larger memory allocations</li>
                                <li>Deploy to Google Cloud Run</li>
                                <li>Deploy to Heroku or DigitalOcean App Platform</li>
                            </ul>
                        </div>
                    `;
                    
                    // Insert after header
                    const header = document.querySelector('.header');
                    if (header && header.nextSibling) {
                        header.parentNode.insertBefore(noticeDiv, header.nextSibling);
                    }
                }
            } catch (error) {
                console.log('Health check failed:', error);
            }
        });
    </script>
</body>
</html>
